name: Package runtime image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      multica_version:
        description: Multica CLI version and image tag
        required: false
        default: "0.6.4"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/i94m/multica-runtime

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.multica_version || '' }}" ]; then
            multica_version="${{ github.event.inputs.multica_version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            multica_version="${GITHUB_REF_NAME#v}"
          else
            multica_version="$(sed -n 's/^ARG MULTICA_VERSION=//p' Dockerfile | head -n 1)"
          fi
          echo "multica_version=${multica_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=debian:13-slim
            MULTICA_VERSION=${{ steps.vars.outputs.multica_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.multica_version }}
            ${{ env.IMAGE_NAME }}:latest
